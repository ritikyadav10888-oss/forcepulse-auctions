# Force Pulse behind nginx. setup-server.sh fills in the domain; certbot adds the https part.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Photos are scaled down in the browser; this leaves room for the upload form
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Live bidding (Socket.IO websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        # Overwrites any client-sent value, so sign-in rate limits can't be dodged with a fake header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
